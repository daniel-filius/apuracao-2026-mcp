[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apuracao-2026-mcp"
version = "0.1.1"
description = "Servidor MCP com os resultados oficiais (parciais) das eleições brasileiras, direto da divulgação do TSE"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Daniel Filius" }]
keywords = ["mcp", "model-context-protocol", "eleicoes", "tse", "brasil", "apuracao"]
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
apuracao-mcp = "apuracao_mcp.server:main"
apuracao-bot = "apuracao_mcp.bot:main"

[project.urls]
Homepage = "https://github.com/daniel-filius/apuracao-2026-mcp"
Repository = "https://github.com/daniel-filius/apuracao-2026-mcp"

[tool.setuptools]
packages = ["apuracao_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
